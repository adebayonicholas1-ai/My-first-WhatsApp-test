services:
  - type: web
    name: enquiryiq-whatsapp
    env: node
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        value: whatsapp:+14155238886
      - key: TWILIO_WHATSAPP_TO
        sync: false
      - key: PORT
        value: 3000
